[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuml-plantuml"
version = "0.1.0"
description = "PlantUML rendering integration for xuml"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "xuml-core @ file:///C:/Users/0501JP/xuml/packages/xuml-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xuml_plantuml*"]