[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuml-core"
version = "0.1.0"
description = "Core semantic IR, analysis, and rendering for xuml"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xuml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]