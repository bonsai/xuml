[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuml-java"
version = "0.1.0"
description = "Java backend wrapper for xuml diagram engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "xuml-core @ file:///C:/Users/0501JP/xuml/packages/xuml-core",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xuml_java*"]