<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">xuml architecture</title><desc id="desc">Local-first source analysis, semantic IR, validation and render plugins, CI and future server integration.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.b{fill:#f8fafc;stroke:#475569;stroke-width:1.5;rx:12}.c{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.f{fill:#fef3c7;stroke:#a16207;stroke-width:1.5;stroke-dasharray:6 4;rx:12}.t{font:600 16px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:13px system-ui,sans-serif;fill:#334155;text-anchor:middle}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1000" height="620" fill="#fff"/><text x="500" y="32" class="t" style="font-size:23px">xuml — Local-first hybrid architecture</text>
<rect class="b" x="35" y="65" width="270" height="76"/><text class="t" x="170" y="94">Source adapters</text><text class="s" x="170" y="117">Python / xuml DSL / YAML</text>
<rect class="b" x="365" y="65" width="270" height="76"/><text class="t" x="500" y="94">Parse and analyze</text><text class="s" x="500" y="117">AST · types · provenance</text>
<rect class="c" x="695" y="65" width="270" height="76"/><text class="t" x="830" y="94">Semantic common IR</text><text class="s" x="830" y="117">IDs · relations · confidence</text>
<path class="e" d="M305 103 H355"/><path class="e" d="M635 103 H685"/>
<rect class="b" x="70" y="195" width="260" height="84"/><text class="t" x="200" y="228">Validators</text><text class="s" x="200" y="252">structure · topology · contracts</text>
<rect class="b" x="370" y="195" width="260" height="84"/><text class="t" x="500" y="228">Render plugins</text><text class="s" x="500" y="252">SVG · Mermaid · PlantUML</text>
<rect class="b" x="670" y="195" width="260" height="84"/><text class="t" x="800" y="228">Diagnostics and artifacts</text><text class="s" x="800" y="252">JSON · stable exit codes</text>
<path class="e" d="M830 141 V170 H200 V185"/><path class="e" d="M830 141 V170 H500 V185"/><path class="e" d="M330 237 H360"/><path class="e" d="M630 237 H660"/>
<rect class="c" x="70" y="330" width="400" height="88"/><text class="t" x="270" y="360">Local runtime</text><text class="s" x="270" y="384">CLI · JSONL events · SQLite index/cache</text><text class="s" x="270" y="402">Offline operation; sync can resume later</text>
<rect class="b" x="530" y="330" width="400" height="88"/><text class="t" x="730" y="360">GitHub Actions quality gate</text><text class="s" x="730" y="384">push / PR differential checks</text><text class="s" x="730" y="402">main / schedule / manual full checks</text>
<path class="e" d="M200 279 V310 H270 V320"/><path class="e" d="M800 279 V310 H730 V320"/>
<rect class="f" x="70" y="465" width="400" height="88"/><text class="t" x="270" y="495">Future server integration</text><text class="s" x="270" y="519">API · workers · PostgreSQL · SSE</text><text class="s" x="270" y="537">Optional; local core remains usable</text>
<rect class="f" x="530" y="465" width="400" height="88"/><text class="t" x="730" y="495">Artifact and browser layer</text><text class="s" x="730" y="519">object storage · dashboard</text><text class="s" x="730" y="537">large binaries outside Git</text>
<path class="e" d="M270 418 V455"/><path class="e" d="M730 418 V455"/><path class="e" d="M470 509 H520"/>
<text class="s" x="500" y="590">Semantic meaning is canonical; AST, graph, and layout are derived views.</text></svg>