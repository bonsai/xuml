schema_version: "1.0"
project:
  id: bonsai.xuml
  name: xuml
  status: planning
  purpose: "Make code structure inspectable and verifiable through a shared semantic model."
  principles:
    - "GitHub Issues are the canonical entry point for feature work."
    - "Define contracts before implementation."
    - "Separate semantic meaning from diagram layout."
    - "Use stable IDs and provenance across design, source, diagnostics, events, and artifacts."
    - "Distinguish confirmed facts, inferences, runtime observations, and unknowns."
    - "Validation failure must not overwrite last-known-good outputs."

decisions:
  sources_of_truth:
    choice: D
    github: "Canonical change history, Issues, ADRs, reviews, and repository documents."
    xuml_dsl: "Design model, metamodel, constraints, expected structure."
    source_code: "Implemented declarations and source-level structure."
    runtime_events: "Observed execution and validation facts."
    artifacts: "Generated diagrams, reports, and media."
  design_code_mapping:
    choice: D
    approach: "External mapping plus evidence, confidence, and approval state."
    required_fields: [design_id, source_language, source_path, source_symbol, evidence, confidence, status]
  mismatch_lifecycle:
    choice: D
    severities: [error, warning, info]
    workflow: [detect, classify, link_issue_or_exception, repair, revalidate]
    exception_fields: [reason, approved_by, expires_at, issue_ref, rule_id]
  verification:
    choice: D
    stages: [structural_matching, topology, behavioral_contracts]
  common_ir:
    choice: D
    canonical: "Semantic model; AST, graph, and layout are derived projections."
    concepts: [entities, types, relationships, constraints, provenance, confidence, unknowns]
    outputs: [svg, mmd, puml, json]
  metamodel:
    choice: C
    approach: "Small trusted bootstrap core plus self-described metamodels."
    core: [types, constraints, stable_ids, versions, validation_rules]
    formal_proving: "Not an initial requirement."
  formats:
    choice: C
    xuml_dsl: "Human-facing UML-like declarations and constraints."
    json: "Versioned IR and API/plugin request-response contracts."
    yaml: "Configuration, templates, and workflow definitions."
    jsonl: "Append-only execution and validation event stream."
  dsl_style:
    choice: C
    approach: "UML-like declaration layer plus optional Lean-inspired types and constraints."
  language_strategy:
    choice: D
    approach: "Choose language per component; use common IR and versioned JSON contracts."
    criteria: [runtime_performance, reliability_and_type_safety, topology_fit, integration, operability]
    excluded_criterion: "Development speed is considered noise for ADR scoring."
  initial_release:
    choice: B
    scope: "Diagram generation plus structural validation."
    first_vertical_slice: [python_class_structure, common_ir, structural_validation, json_diagnostics, svg, mermaid, plantuml]
  artifact_storage:
    choice: C
    git: "Reviewable source, DSL, YAML, ADRs, stable diagrams."
    jsonl: "Execution and validation history."
    sqlite: "Local index, query, and sync state."
    postgresql: "Later server-side integration."
    object_storage: "Large images, videos, and binary artifacts."
  ci_scope:
    choice: C
    push: "Differential checks."
    pull_request: "Differential checks plus affected-scope validation."
    main_merge: "Full validation."
    schedule: "Full re-analysis."
    manual: "Full validation on demand."
    unknown_impact: "Fall back to full validation."
  ci_failure:
    choice: C
    policy: "Serious errors block merge; explicit auditable waivers only."
    waiver_fields: [reason, approved_by, expires_at, issue_ref, rule_id]
    expired_waiver: "Treat as an active error."
  python_analysis:
    choice: D
    stages:
      - "Classes, attributes, inheritance, type annotations."
      - "Module imports and dependency cycles."
      - "Statically resolvable function/method calls."
    uncertainty: "Keep confirmed facts, inferred relations, runtime observations, and unknowns separate."
  testing:
    choice: D
    layers: [fixed_fixtures, malformed_input, property_based_invariants, self_analysis, design_drift, plugin_failure_simulation]
    rule: "Self-analysis supplements but never replaces independent tests."
  diagnostics:
    choice: C
    required_fields: [id, rule_id, severity, code, message, location, element_ids, cause, evidence, suggested_fix, issue_ref, exception_ref]
  delivery:
    choice: C
    approach: "Define contracts first, then implement the smallest usable CLI vertical slice."

architecture:
  topology: hybrid_local_first
  initial_process_model: "Modular CLI; separate API/workers only when justified."
  local_components: [source_parsing, dsl_parsing, ir_generation, validation, cli_plugins, jsonl_events, sqlite_index_cache]
  future_server_components: [api, workers, postgresql, object_storage, browser_dashboard, sse_updates]
  offline_behavior: "Continue locally, append JSONL events, sync after server recovery."
  dashboard_sync: "HTTP initial fetch, SSE updates, diff sync after reconnect."
  plugin_contract: "External CLI process; JSON stdin/stdout, stderr logs; handle timeout, nonzero exit, malformed JSON, process failure."
  layout: "Semantic model is independent from layout; internal simple layout plus optional external layout plugin."
  event_fields: [event_id, run_id, parent_event_id, model_id, step_id, timestamp, status, artifact_refs]

phases:
  - id: P0
    name: Contracts
    tasks: [versioned_ir, stable_ids, diagnostic_schema, cli_exit_codes, provenance, fixtures]
  - id: P1
    name: Python structural analysis
    tasks: [extract_classes_and_annotations, build_ir, structural_validation, render_svg_mmd_puml]
  - id: P2
    name: Tests and CI
    tasks: [regression_tests, malformed_input_tests, deterministic_output, push_pr_workflows, full_main_scheduled_checks]
  - id: P3
    name: Topology analysis
    tasks: [module_imports, dependency_cycles, boundary_checks]
  - id: P4
    name: Calls and self-verification
    tasks: [static_call_relations, unknown_target_marking, design_implementation_comparison]
  - id: P5
    name: DSL and metamodel
    tasks: [UML_like_DSL, constraint_layer, bootstrap_validation, external_mapping]
  - id: P6
    name: Local events and optional server
    tasks: [JSONL_events, SQLite_index, later_API_SSE, later_PostgreSQL_object_storage]

open_questions:
  - "Implementation language per component."
  - "Exact versioned IR schema and stable ID strategy."
  - "CLI commands and exit-code registry."
  - "Exact DSL grammar and constraint semantics."
  - "SVG layout policy and optional Graphviz integration."
  - "Safe differential-analysis scope when dependency impact is uncertain."
