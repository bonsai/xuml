[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xuml"
version = "0.1.0"
description = "Local-first source structure to semantic IR and SVG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
xuml = "xuml.cli:main"

[tool.setuptools.packages.find]
include = ["xuml*"]
