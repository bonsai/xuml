[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuml"
version = "0.1.0"
description = "Local-first, YAML-driven diagram intent router"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
license = { text = "MIT" }
authors = [{ name = "bonsai" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xuml = "xuml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
