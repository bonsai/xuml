name: Make issue graph

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: make-issue-graph
  cancel-in-progress: true

jobs:
  build-issue-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch issues and build graph artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, math, os, re, urllib.request
          from html import escape
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          issues = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/issues?state=all&per_page=100&page={page}"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as response:
                  batch = json.load(response)
              if not batch:
                  break
              issues.extend(item for item in batch if "pull_request" not in item)
              if len(batch) < 100:
                  break
              page += 1

          issues.sort(key=lambda item: item["number"])
          by_number = {item["number"]: item for item in issues}
          edges = set()
          pattern = re.compile(r"(?:/issues/|#)(\d+)")
          for item in issues:
              body = item.get("body") or ""
              for match in pattern.finditer(body):
                  target = int(match.group(1))
                  if target in by_number and target != item["number"]:
                      edges.add((item["number"], target))
          edges = sorted(edges)

          out = Path("issue-graph")
          out.mkdir(exist_ok=True)
          (out / "issues.json").write_text(json.dumps({
              "repository": repo,
              "issue_count": len(issues),
              "edges": [{"from": a, "to": b} for a, b in edges],
              "issues": [{
                  "number": item["number"],
                  "title": item["title"],
                  "state": item["state"],
                  "url": item["html_url"],
                  "labels": [label["name"] for label in item.get("labels", [])],
              } for item in issues],
          }, ensure_ascii=False, indent=2), encoding="utf-8")

          mermaid = ["flowchart LR"]
          for item in issues:
              title = item["title"].replace('"', "'").replace("[", "(").replace("]", ")")
              state = "closed" if item["state"] == "closed" else "open"
              mermaid.append(f'  I{item["number"]}["#{item["number"]} {title} · {state}"]')
          for source, target in edges:
              mermaid.append(f"  I{source} -. references .-> I{target}")
          (out / "issue-graph.mmd").write_text("\n".join(mermaid) + "\n", encoding="utf-8")

          # Deterministic, dependency-free SVG. Nodes are arranged on a circle;
          # the JSON and Mermaid files remain the machine-readable artifacts.
          width, height = 1600, 1200
          cx, cy = width / 2, height / 2
          radius = min(width, height) * 0.37 if len(issues) > 1 else 0
          positions = {}
          for index, item in enumerate(issues):
              angle = -math.pi / 2 + 2 * math.pi * index / max(len(issues), 1)
              positions[item["number"]] = (cx + radius * math.cos(angle), cy + radius * math.sin(angle))
          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" fill="#f8fafc"/>',
              '<text x="40" y="48" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">xuml · GitHub Issue Graph</text>',
              f'<text x="40" y="78" font-family="sans-serif" font-size="15" fill="#475569">{len(issues)} issues · {len(edges)} reference links · generated by GitHub Actions</text>',
          ]
          for source, target in edges:
              x1, y1 = positions[source]
              x2, y2 = positions[target]
              svg.append(f'<line x1="{x1:.1f}" y1="{y1:.1f}" x2="{x2:.1f}" y2="{y2:.1f}" stroke="#94a3b8" stroke-width="1.5" opacity="0.65"/>')
          for item in issues:
              x, y = positions[item["number"]]
              is_closed = item["state"] == "closed"
              fill = "#dcfce7" if is_closed else "#dbeafe"
              stroke = "#16a34a" if is_closed else "#2563eb"
              title = item["title"]
              short = title if len(title) <= 42 else title[:39] + "..."
              svg.append(f'<a href="{escape(item["html_url"], quote=True)}" target="_blank">')
              svg.append(f'<rect x="{x-112:.1f}" y="{y-27:.1f}" width="224" height="54" rx="10" fill="{fill}" stroke="{stroke}" stroke-width="1.5"/>')
              svg.append(f'<text x="{x:.1f}" y="{y-4:.1f}" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">#{item["number"]} · {escape(short)}</text>')
              svg.append(f'<text x="{x:.1f}" y="{y+15:.1f}" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">{item["state"]}</text>')
              svg.append('</a>')
          svg.append("</svg>")
          (out / "issue-graph.svg").write_text("\n".join(svg) + "\n", encoding="utf-8")

          html = """<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xuml Issue Graph</title><style>body{font:16px system-ui;margin:2rem;background:#f8fafc;color:#0f172a}img{width:100%;height:auto}nav a{margin-right:1rem}</style><h1>xuml Issue Graph</h1><nav><a href="issue-graph.svg">SVG</a><a href="issue-graph.mmd">Mermaid source</a><a href="issues.json">JSON data</a></nav><img src="issue-graph.svg" alt="Graph of GitHub issues and cross-references"></html>"""
          (out / "index.html").write_text(html, encoding="utf-8")
          print(f"Built graph for {len(issues)} issues and {len(edges)} references.")
          PY

      - name: Upload graph artifact only
        uses: actions/upload-artifact@v4
        with:
          name: issue-graph
          path: issue-graph/
          if-no-files-found: error
          retention-days: 14
