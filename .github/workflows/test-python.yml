name: Python YAML core tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate YAML catalog
        run: xuml check
      - name: Route example and render SVG
        run: xuml route examples/intent.yaml --json-out out/route.json --svg-out out/route.svg
      - name: Run tests
        run: pytest -q
      - name: Upload route output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuml-route-python-${{ matrix.python-version }}
          path: |
            out/route.json
            out/route.svg
          if-no-files-found: ignore
